<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Candle Crawl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Layout: one phone-width column of soft pastel cards, a dark pill nav fixed at the bottom. */
  :root {
    --bg-1: #fbe6d8;
    --bg-2: #f6d3e0;
    --ink: #1f1b24;
    --ink-2: #4a4452;
    --muted: #8a8292;
    --card: #ffffff;
    --cream: #fbf7dc;
    --pink: #f07f98;
    --pink-l: #f9bccb;
    --mustard: #f2b544;
    --mustard-l: #f9d685;
    --teal: #3f8f7a;
    --teal-l: #9fd8c4;
    --lav: #8f86e8;
    --lav-l: #c4bff7;
    --orange: #f59a4a;
    --orange-l: #fbc08c;
    --up: #23966a;
    --down: #e0516c;
    --r-xl: 30px;
    --r-lg: 22px;
    --r-md: 16px;
    --font: "Outfit", ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    font-family: var(--font);
    color: var(--ink);
    background: linear-gradient(160deg, var(--bg-1), var(--bg-2));
    background-color: var(--bg-1);
    background-attachment: fixed;
    min-height: 100vh;
    padding: 16px max(16px, env(safe-area-inset-right)) calc(110px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  .app { max-width: 460px; margin: 0 auto; display: grid; gap: 14px; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .hidden { display: none !important; }
  .num { font-variant-numeric: tabular-nums; }

  .card { border-radius: var(--r-xl); padding: 20px; background: var(--card); position: relative; overflow: hidden; }
  .card.cream { background: var(--cream); }
  .card.pink { background: var(--pink); }
  .card.lav { background: var(--lav); color: #fff; }
  .card.teal { background: var(--teal); color: #fff; }
  .card.ink { background: var(--ink); color: #fff; }
  .card.mustard { background: var(--mustard); }
  .card.orange { background: var(--orange); }
  .eyebrow { font-size: .78rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; opacity: .7; }
  h1, h2, h3 { margin: 0; letter-spacing: -0.02em; text-wrap: balance; }
  .big { font-size: 3.2rem; font-weight: 800; letter-spacing: -0.04em; line-height: 1; }

  .pill { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 9px 16px; font-weight: 600; font-size: .9rem; }
  .round { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0; }
  .round.dark { background: var(--ink); color: #fff; }
  .round.white { background: rgba(255,255,255,.85); color: var(--ink); }
  .round svg { width: 22px; height: 22px; }

  /* Header */
  .header { display: flex; align-items: center; gap: 10px; }
  .header .who { flex: 1; min-width: 0; }
  .header h2 { font-size: 1.2rem; }
  .header .sub { font-size: .82rem; opacity: .8; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .avatar { width: 46px; height: 46px; border-radius: 50%; background: var(--mustard-l); display: grid; place-items: center; font-size: 1.5rem; border: 3px solid #fff; flex-shrink: 0; }
  .live { display: inline-flex; align-items: center; gap: 6px; }
  .live i { width: 8px; height: 8px; border-radius: 50%; background: #3ee08f; flex-shrink: 0; box-shadow: 0 0 0 0 rgba(62,224,143,.6); animation: pulse 1.6s infinite; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 8px rgba(62,224,143,0); } 100% { box-shadow: 0 0 0 0 rgba(62,224,143,0); } }
  .daybar { margin-top: 16px; height: 10px; border-radius: 999px; background: rgba(255,255,255,.45); overflow: hidden; }
  .daybar div { height: 100%; width: 0; background: var(--ink); border-radius: 999px; transition: width .2s linear; }
  .card.ink .daybar { background: rgba(255,255,255,.15); }
  .card.ink .daybar div { background: linear-gradient(90deg, var(--pink), var(--mustard)); }
  .daylabels { display: flex; justify-content: space-between; font-size: .78rem; margin-top: 6px; opacity: .8; font-weight: 500; }
  .boss-tag { display: inline-block; background: var(--mustard); color: var(--ink); border-radius: 999px; padding: 1px 8px; font-size: .7rem; font-weight: 800; letter-spacing: .04em; vertical-align: 2px; }

  /* Net worth card */
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 18px; }
  .tile { border-radius: var(--r-md); padding: 10px 6px; text-align: center; background: #fff; }
  .tile:nth-child(1) { background: var(--teal-l); }
  .tile:nth-child(2) { background: var(--pink-l); }
  .tile:nth-child(3) { background: #fff; border: 2px dashed #e6dfb9; }
  .tile b { display: block; font-size: 1.05rem; font-weight: 700; }
  .tile span { font-size: .72rem; color: var(--ink-2); }
  .nw-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
  .nw-row .label { color: var(--ink-2); font-size: .9rem; margin-top: 6px; }
  .goal { text-align: right; }
  .goal b { font-size: 1.5rem; font-weight: 800; display: block; }
  .goal span { font-size: .8rem; color: var(--ink-2); }
  .progress { margin-top: 14px; height: 14px; background: #efe8c2; border-radius: 999px; overflow: hidden; position: relative; }
  .progress div { height: 100%; width: 0; background: linear-gradient(90deg, var(--pink), var(--orange)); border-radius: 999px; transition: width .25s; }
  .progress.done div { background: linear-gradient(90deg, var(--teal), #5fc29e); }

  /* Chart */
  .chart-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
  .chart-head h3 { font-size: 1.1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chart-head .price { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.03em; text-align: right; }
  .chart-head .left { min-width: 0; }
  .chg { font-weight: 700; font-size: .85rem; }
  .chg.up { color: var(--up); } .chg.down { color: var(--down); }
  canvas#chart { width: 100%; height: 200px; display: block; }
  .chart-foot { display: flex; justify-content: space-between; align-items: center; font-size: .75rem; color: var(--muted); margin-top: 6px; gap: 8px; }
  .seg { display: inline-flex; background: #efe8c2; border-radius: 999px; padding: 3px; }
  .seg button { border-radius: 999px; padding: 5px 12px; font-size: .78rem; font-weight: 700; color: var(--ink-2); }
  .seg button.on { background: var(--ink); color: #fff; }

  /* Trade panel */
  .trade-top { display: flex; align-items: center; gap: 12px; }
  .trade-top .ic { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-size: 1.5rem; flex-shrink: 0; }
  .trade-top .info { flex: 1; min-width: 0; }
  .trade-top .info b { font-size: 1.05rem; }
  .trade-top .info div { font-size: .82rem; opacity: .75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .qty { display: flex; gap: 6px; margin: 16px 0 12px; }
  .qty button { flex: 1; border-radius: 999px; padding: 9px 0; background: rgba(255,255,255,.1); color: #fff; font-weight: 600; font-size: .9rem; }
  .qty button.on { background: #fff; color: var(--ink); }
  .trade-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .trade-btns button { border-radius: 20px; padding: 14px 10px; font-weight: 800; font-size: 1.05rem; color: var(--ink); line-height: 1.15; }
  .trade-btns button small { display: block; font-weight: 500; font-size: .75rem; opacity: .75; }
  .buy { background: var(--mustard); }
  .sell { background: var(--pink); }
  .ghost-btn { margin-top: 10px; width: 100%; border-radius: 999px; padding: 10px; background: rgba(255,255,255,.12); color: #fff; font-weight: 600; }
  .halt-note { margin-top: 10px; border-radius: 14px; padding: 8px 12px; background: rgba(240,127,152,.25); font-size: .85rem; font-weight: 600; text-align: center; }

  /* Stock list rows */
  .stocks { display: grid; gap: 10px; }
  .row { display: flex; align-items: center; gap: 10px; border-radius: 999px; padding: 8px; text-align: left; width: 100%; border: 3px solid transparent; transition: transform .1s; }
  .row:active { transform: scale(.98); }
  .row.sel { border-color: var(--ink); }
  .row.flash-up { animation: flashUp .7s ease-out; }
  .row.flash-down { animation: flashDown .7s ease-out; }
  @keyframes flashUp { 0% { box-shadow: 0 0 0 0 rgba(35,150,106,.0); } 30% { box-shadow: 0 0 0 6px rgba(35,150,106,.45); } 100% { box-shadow: 0 0 0 0 rgba(35,150,106,0); } }
  @keyframes flashDown { 0% { box-shadow: 0 0 0 0 rgba(224,81,108,0); } 30% { box-shadow: 0 0 0 6px rgba(224,81,108,.5); } 100% { box-shadow: 0 0 0 0 rgba(224,81,108,0); } }
  .row .ic { width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,.6); display: grid; place-items: center; font-size: 1.3rem; flex-shrink: 0; }
  .row .t { flex: 1; min-width: 0; }
  .row .t b { display: block; font-size: 1rem; font-weight: 800; }
  .row .t span { font-size: .78rem; color: var(--ink-2); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row svg.spark { width: 60px; height: 28px; flex-shrink: 0; }
  .row .pct { width: 58px; height: 58px; border-radius: 50%; background: #fff; display: grid; place-items: center; flex-shrink: 0; font-weight: 800; font-size: .82rem; text-align: center; line-height: 1.05; }
  .row .pct small { display: block; font-weight: 500; font-size: .68rem; color: var(--muted); }
  .badge { display: inline-block; font-size: .66rem; font-weight: 700; background: var(--ink); color: #fff; border-radius: 999px; padding: 1px 7px; margin-left: 4px; vertical-align: 2px; }

  /* News */
  .news h3 { font-size: 1.15rem; margin: 6px 0 4px; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { background: rgba(255,255,255,.55); border-radius: 999px; padding: 3px 10px; font-size: .75rem; font-weight: 600; }
  .feed { display: grid; gap: 8px; margin-top: 12px; }
  .feed div { background: rgba(255,255,255,.4); border-radius: 14px; padding: 8px 12px; font-size: .85rem; }
  .feed div em { font-style: normal; opacity: .7; font-size: .75rem; margin-right: 6px; }
  .upcoming { display: grid; gap: 6px; margin-top: 12px; }
  .upcoming .ev { border: 1px solid #f0ead0; display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 16px; padding: 8px 12px; font-size: .85rem; font-weight: 600; }
  .upcoming .ev .tm { background: var(--ink); color: #fff; border-radius: 999px; padding: 2px 8px; font-size: .75rem; }
  .upcoming .ev .wh { margin-left: auto; font-size: .75rem; font-weight: 700; }

  /* Bottom nav */
  .nav { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom)); background: var(--ink); border-radius: 999px; padding: 8px; display: flex; gap: 6px; z-index: 20; box-shadow: 0 10px 30px rgba(31,27,36,.3); }
  .nav button { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; color: #b9b2c2; }
  .nav button svg { width: 24px; height: 24px; }
  .nav button.on { background: var(--lav); color: #fff; }

  /* Portfolio */
  .hold { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: var(--r-lg); background: #fff; }
  .hold .ic { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; font-size: 1.3rem; }
  .hold .t { flex: 1; min-width: 0; }
  .hold .t b { display: block; }
  .hold .t span { font-size: .8rem; color: var(--muted); }
  .hold .v { text-align: right; font-weight: 700; }
  .hold .v span { display: block; font-size: .8rem; }
  .list { display: grid; gap: 8px; }
  .empty { color: var(--muted); font-size: .9rem; padding: 8px 2px; }

  /* Perks */
  .perk { border-radius: var(--r-lg); padding: 16px; display: flex; gap: 12px; align-items: center; }
  .perk .ic { width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.6); display: grid; place-items: center; font-size: 1.5rem; flex-shrink: 0; }
  .perk b { display: block; font-size: 1.02rem; }
  .perk span { font-size: .84rem; color: var(--ink-2); }
  .perk .count { margin-left: auto; font-weight: 800; background: #fff; border-radius: 999px; padding: 4px 10px; font-size: .85rem; }
  .rarity-common { background: var(--teal-l); }
  .rarity-rare { background: var(--lav-l); }
  .rarity-legendary { background: var(--mustard-l); }
  .rar { font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; opacity: .65; }

  /* Ranks */
  .rank { display: flex; align-items: center; gap: 10px; }
  .rank .bar { flex: 1; display: flex; align-items: center; gap: 12px; border-radius: 999px; padding: 10px 16px; font-weight: 800; font-size: 1.3rem; }
  .rank .bar .tr { width: 36px; height: 36px; border-radius: 12px; background: rgba(255,255,255,.6); display: grid; place-items: center; font-size: 1.1rem; }
  .rank .bar small { font-size: .78rem; font-weight: 500; margin-left: auto; text-align: right; line-height: 1.2; }
  .rank .circ { width: 58px; height: 58px; border-radius: 50%; background: #fff; display: grid; place-items: center; text-align: center; font-weight: 800; line-height: 1; flex-shrink: 0; }
  .rank .circ small { display: block; font-size: .62rem; font-weight: 500; color: var(--muted); }

  /* Home */
  .hero h1 { font-size: 2.3rem; line-height: 1.02; margin: 6px 0 10px; max-width: 13ch; }
  .hero p { margin: 0 0 22px; opacity: .9; max-width: 30ch; line-height: 1.4; }
  .hero .deco { position: absolute; right: -10px; top: 18px; font-size: 6.5rem; transform: rotate(12deg); opacity: .95; }
  .hero-cta { display: flex; align-items: center; gap: 12px; font-weight: 700; }
  .stat-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat { border-radius: var(--r-lg); padding: 14px 12px; background: #fff; border: 3px solid var(--orange-l); }
  .stat:nth-child(2) { border-color: var(--lav-l); background: #f3f1ff; }
  .stat:nth-child(3) { border-color: var(--mustard-l); background: #fff9e6; }
  .stat .eyebrow { font-size: .68rem; }
  .stat b { font-size: 2rem; font-weight: 800; letter-spacing: -0.04em; display: block; margin-top: 4px; }
  .stat span { color: var(--muted); font-size: .78rem; }
  .how { display: grid; gap: 10px; margin-top: 12px; }
  .how div { display: flex; gap: 10px; align-items: flex-start; font-size: .92rem; line-height: 1.35; }
  .how div i { font-style: normal; width: 30px; height: 30px; border-radius: 50%; background: #fff; display: grid; place-items: center; flex-shrink: 0; font-weight: 800; font-size: .85rem; }

  /* Trading desk (meta upgrades) */
  .desk-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
  .wax { background: #fff; color: var(--ink); border-radius: 999px; padding: 6px 12px; font-weight: 800; }
  .desk-item { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,.14); border-radius: 20px; padding: 10px 12px; width: 100%; text-align: left; color: #fff; }
  .desk-item .ic { width: 42px; height: 42px; border-radius: 14px; background: rgba(255,255,255,.18); display: grid; place-items: center; font-size: 1.3rem; flex-shrink: 0; }
  .desk-item .t { flex: 1; min-width: 0; }
  .desk-item .t b { display: block; font-size: .95rem; }
  .desk-item .t span { font-size: .78rem; opacity: .8; }
  .desk-item .cost { background: #fff; color: var(--ink); border-radius: 999px; padding: 6px 10px; font-weight: 800; font-size: .82rem; white-space: nowrap; }
  .pips { display: inline-flex; gap: 3px; margin-left: 6px; vertical-align: 1px; }
  .pips i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.3); }
  .pips i.on { background: var(--mustard); }

  /* Modal */
  .modal { position: fixed; inset: 0; background: rgba(31,27,36,.45); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); z-index: 50; display: grid; place-items: center; padding: 16px; overflow-y: auto; }
  .sheet { width: 100%; max-width: 440px; display: grid; gap: 12px; animation: pop .25s ease-out; }
  @keyframes pop { from { transform: translateY(16px) scale(.97); opacity: 0; } }
  .choice { text-align: left; width: 100%; transition: transform .1s; }
  .choice:hover { transform: translateY(-2px); }
  .choice .go { margin-left: auto; width: 40px; height: 40px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; flex-shrink: 0; }
  .big-btn { width: 100%; border-radius: 999px; padding: 16px; background: var(--ink); color: #fff; font-weight: 700; font-size: 1.05rem; }
  .big-btn.light { background: #fff; color: var(--ink); }
  .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
  .summary div { background: rgba(255,255,255,.55); border-radius: 16px; padding: 10px 12px; }
  .summary b { display: block; font-size: 1.25rem; }
  .summary span { font-size: .78rem; color: var(--ink-2); }

  /* Toasts, floats, confetti */
  .toasts { position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 60; display: grid; gap: 8px; width: min(440px, calc(100% - 32px)); pointer-events: none; }
  .toast { background: var(--ink); color: #fff; border-radius: 18px; padding: 10px 14px; font-size: .9rem; font-weight: 500; box-shadow: 0 8px 24px rgba(0,0,0,.25); animation: pop .2s ease-out; }
  .toast.good { background: var(--teal); }
  .toast.bad { background: #c9435d; }
  .float { position: fixed; z-index: 65; pointer-events: none; font-weight: 800; font-size: 1.3rem; animation: floatUp 1.1s ease-out forwards; text-shadow: 0 2px 0 #fff; }
  @keyframes floatUp { to { transform: translateY(-70px); opacity: 0; } }
  canvas#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 70; }
  .frozen-banner { background: #bfe6ff; color: var(--ink); border-radius: 999px; padding: 8px 14px; font-weight: 700; text-align: center; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="nav hidden" id="nav" aria-label="Game sections">
  <button data-tab="market" class="on" aria-label="Market"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M17 4v16"/><rect x="4.5" y="8" width="5" height="7" rx="1.2"/><rect x="14.5" y="6" width="5" height="9" rx="1.2"/></svg></button>
  <button data-tab="portfolio" aria-label="Portfolio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="3"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M3 12h18"/></svg></button>
  <button data-tab="perks" aria-label="Perks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg></button>
  <button data-tab="ranks" aria-label="Leaderboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg></button>
</nav>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="modalRoot"></div>
<canvas id="fx"></canvas>

<script>
(() => {
'use strict';

// ================= Data =================
const STOCK_POOL = [
  { tk: 'SNAX', name: 'Snackwave Foods', icon: '🍿', price: 42, vol: .012, drift: .0006, ev: .8,
    good: ['Snackwave\'s pickle-flavored popcorn sells out nationwide', 'SNAX lands a stadium snack deal'],
    bad: ['Snackwave recalls 2 million bags of "mystery flavor"', 'Health study says SNAX chips are "basically air"'] },
  { tk: 'ROKT', name: 'Rocketry Labs', icon: '🚀', price: 118, vol: .034, drift: .0004, ev: 1.4,
    good: ['Rocketry Labs lands a rocket on its first try', 'ROKT wins a giant moon contract'],
    bad: ['ROKT test rocket "goes sideways"', 'Rocketry Labs launch delayed indefinitely'] },
  { tk: 'MOOO', name: 'Moo Moo Dairy', icon: '🐄', price: 23, vol: .01, drift: .0005, ev: .7,
    good: ['Moo Moo\'s oat-milk-flavored milk is a hit', 'Cows reportedly "extra happy" this quarter'],

function gauss() { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }

function money(v, dec) {
  const neg = v < 0; v = Math.abs(v);
  let s;
  if (v >= 1e9) s = (v / 1e9).toFixed(2) + 'B';
  else if (v >= 1e6) s = (v / 1e6).toFixed(2) + 'M';
  else if (v >= 1e5) s = (v / 1e3).toFixed(1) + 'K';
  else s = v.toLocaleString('en-US', { minimumFractionDigits: dec ?? (v < 1000 ? 2 : 0), maximumFractionDigits: dec ?? (v < 1000 ? 2 : 0) });
  return (neg ? '-$' : '$') + s;
}

const fx = (() => {
  const cv = $('fx'), c = cv.getContext('2d');
  let parts = [], running = false;
  const size = () => { const d = window.devicePixelRatio || 1; cv.width = innerWidth * d; cv.height = innerHeight * d; c.setTransform(d, 0, 0, d, 0, 0); };
  size(); addEventListener('resize', size);
  const colors = ['#f07f98', '#f2b544', '#3f8f7a', '#8f86e8', '#f59a4a', '#ffffff'];
  function frame() {
    c.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter(p => p.y < innerHeight + 20 && p.life > 0);
    for (const p of parts) {
      p.x += p.vx; p.y += p.vy; p.vy += .18; p.vx *= .99; p.r += p.vr; p.life -= .004;
      c.save(); c.translate(p.x, p.y); c.rotate(p.r); c.fillStyle = p.col; c.globalAlpha = Math.min(1, p.life * 2);
      c.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); c.restore();
    }
    if (parts.length) requestAnimationFrame(frame); else { running = false; c.clearRect(0, 0, innerWidth, innerHeight); }
  }
  return {
    burst(n = 120) {
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      for (let i = 0; i < n; i++) parts.push({ x: innerWidth / 2 + rand(-60, 60), y: innerHeight * .35, vx: rand(-8, 8), vy: rand(-12, -4), r: rand(0, 6), vr: rand(-.3, .3), s: rand(6, 12), col: pick(colors), life: 1 });
      if (!running) { running = true; requestAnimationFrame(frame); }
    },
  };
})();

const netWorth = () => S.cash + S.stocks.reduce((a, s) => a + s.qty * s.price, 0);

function goalFor(day) {
  let g = START_CASH;
  for (let d = 1; d <= day; d++) g *= 1.2 + .03 * (d - 1);
  return g * Math.pow(.94, S.perks.easy || 0);
}

function startDay() {

  S.mood = S.boss || (S.day === 1 ? MOODS[0] : pick(MOODS));

// Earnings reports (and the boss crash) are posted in advance so you can plan for them
function buildSchedule() {
  const start = S.dayStartMin;
  const n = 2 + (S.mood.id === 'frenzy' ? 1 : 0);
  const picks = shuffle(S.stocks).slice(0, n);
  const slots = shuffle([4, 7, 10, 13, 16, 19]).slice(0, n).sort((a, b) => a - b);
  S.schedule = picks.map((s, i) => {
    const atMin = start + slots[i] * 60 + Math.round(rand(0, 50));
    const lead = has('earnings') ? 150 : 90;
    return { type: 'earn', s, atMin, hintAt: atMin - lead, good: Math.random() < pGood(), hinted: false, done: false };
  });
  if (S.boss && S.boss.id === 'crash') S.schedule.push({ type: 'crash', atMin: start + Math.round(rand(9, 13) * 60), done: false });
  S.schedule.sort((a, b) => a.atMin - b.atMin);
}

// ================= Simulation =================
function stepPrices(dayLength, dt, silent) {
  const minutes = dt * 1440 / dayLength;
  const h = minutes / 60;
  for (const s of S.stocks) {
    if (s.halt > 0) { s.hist.push(s.price); if (s.hist.length > 900) s.hist.shift(); continue; }
    let mu = s.drift + S.mood.drift + (S.recover ? .012 : 0);
    if (s.tk === S.hotTk) mu += .012;
    const sigma = s.vol * S.mood.vol * (s.tk === S.memeTk ? 3 : 1);
    const shock = s.shock.length ? s.shock.shift() : 0;
    // Gentle pull back toward the day's open stops runaway trends
    const revert = s.dayOpen ? -.02 * Math.log(s.price / s.dayOpen) * h : 0;
    const r = (mu - sigma * sigma / 2) * h + sigma * Math.sqrt(h) * gauss() + shock + revert;
    s.price = Math.max(.05, s.price * Math.exp(r));
    s.hist.push(s.price);
    if (s.hist.length > 900) s.hist.shift();
  }
  S.tick++;
  if (!silent) S.clockMin += minutes;
}

function hourly() {
  const hour = Math.floor(S.clockMin / 60);
  while (S.lastHour < hour) {
    S.lastHour++;
    if (has('savings') && S.cash > 0) S.cash *= 1 + .004 * S.perks.savings;
    if (has('dividend')) {
      const held = S.stocks.reduce((a, s) => a + Math.max(0, s.qty) * s.price, 0);
      S.cash += held * .003 * S.perks.dividend;
    }
    if (S.cash < 0) S.cash *= 1.003; // margin interest
  }
}

function scheduleNextEvent() { S.nextEvent = rand(6, 11) / S.mood.ev; }

function spawnEvent() {
  if (Math.random() < .12) {
    const up = Math.random() < pGood();
    const m = rand(.04, .09);
    const title = up ? pick(['Central bank cuts rates! Whole market rallies', 'Jobs report blows past expectations', 'Market-wide FOMO kicks in'])
                     : pick(['Sudden selloff! Everything drops', 'Inflation scare spooks traders', 'Big bank wobbles, markets slide']);
    marketShock(up ? m : -m);
    pushNews(title, up ? 'good' : 'bad', ['#Market', up ? '#Rally' : '#Selloff']);
    return;
  }
  const pool = S.memeTk ? [...S.stocks, ...S.stocks.filter(s => s.tk === S.memeTk)] : S.stocks;
  const s = pick(pool);
  const good = Math.random() < pGood();
  const mag = rand(.06, .18) * s.ev;
  if (Math.random() < .5) {
    const insider = has('insider');
    const accurate = insider || Math.random() < .7;
    const hintUp = accurate ? good : !good;
    pushNews(`${insider ? 'Verified tip' : 'Rumor'}: ${s.name} ${hintUp ? 'might have big good news' : 'might be in trouble'}…`, 'rumor',
      ['#' + s.tk, insider ? '#Insider' : '#Rumor', hintUp ? '#Bullish' : '#Bearish']);
    S.pending.push({ s, good, mag, at: insider ? 7 : 4 });
  } else {
    fireCompanyNews(s, good, mag);
  }
}

function fireCompanyNews(s, good, mag) {
  const tpl = Math.random() < .55 ? pick(good ? s.good : s.bad) : pick(good ? GENERIC_GOOD : GENERIC_BAD);
  applyShock(s, good ? mag : -mag);
  pushNews(tpl.replace('{tk}', s.tk).replace('{name}', s.name), good ? 'good' : 'bad', ['#' + s.tk, good ? '#Breaking' : '#Ouch'], s);
}

function marketShock(m) {
  if (m < 0 && has('whalewatch')) m /= 2;
  for (const s of S.stocks) applyShock(s, m);
}

function applyShock(s, m) {
  const steps = 6;
  const per = Math.log(1 + m) / steps;
  for (let i = 0; i < steps; i++) s.shock[i] = (s.shock[i] || 0) + per;
  flashRow(s, m >= 0);
  // Circuit breaker boss: big moves halt the stock (after the move lands)
  if (S.boss && S.boss.id === 'breaker' && Math.abs(m) >= .06 && s.halt <= 0) {
    setTimeout(() => { if (S && S.phase === 'trading') { s.halt = 7; toast(`🚦 ${s.tk} halted for 7 seconds`, 'bad'); renderLive(); } }, 1300);
  }
}

function processSchedule() {
  for (const e of S.schedule) {
    if (e.done) continue;
    if (e.type === 'earn') {
      if (!e.hinted && S.clockMin >= e.hintAt) {
        e.hinted = true;
        const acc = has('earnings') ? 1 : meta.desk.analyst ? .8 : .65;
        e.hintUp = Math.random() < acc ? e.good : !e.good;
        pushNews(`${has('earnings') ? 'Verified whisper' : 'Whisper'}: ${e.s.tk} earnings at ${clock(e.atMin)} look ${e.hintUp ? 'strong 📈' : 'weak 📉'}`, 'rumor',
          ['#' + e.s.tk, '#Earnings', e.hintUp ? '#Bullish' : '#Bearish']);
      }
      if (S.clockMin >= e.atMin) {
        e.done = true;
        const mag = rand(.12, .26) * e.s.ev;
        applyShock(e.s, e.good ? mag : -mag);
        pushNews(e.good ? `${e.s.name} crushes earnings! 🚀` : `${e.s.name} misses earnings badly`, e.good ? 'good' : 'bad', ['#' + e.s.tk, '#Earnings'], e.s);
      }
    }
    if (e.type === 'crash' && S.clockMin >= e.atMin) {
      e.done = true;
      marketShock(-.16);
      S.recover = true;
      pushNews('⚡ FLASH CRASH! Everything plunges', 'bad', ['#Market', '#Crash']);
      shake();
    }
  }
}

function whaleMove() {

  applyShock(s, m);

}

function pushNews(title, kind, tags) {
  S.feed.unshift({ title, kind, tags, time: clock(S.clockMin) });
  S.feed = S.feed.slice(0, 6);

function autoClose() {
  if (!has('stoploss')) return;
  for (const s of S.stocks) {
    if (s.halt > 0) continue;
    if (s.qty > 0 && s.price < s.avg * .9) { const q = s.qty; trade(s, -q, true); toast(`🤖 Stop-loss sold ${q} ${s.tk}`, 'bad'); }
    else if (s.qty < 0 && s.price > s.avg * 1.1) { const q = -s.qty; trade(s, q, true); toast(`🤖 Stop-loss covered ${q} ${s.tk}`, 'bad'); }
  }
}

function update(dt) {
  if (!S || S.phase !== 'trading' || S.paused) return;
  if (S.frozen > 0) { S.frozen = Math.max(0, S.frozen - dt); renderLive(); return; }
  for (const s of S.stocks) if (s.halt > 0) { s.halt = Math.max(0, s.halt - dt); if (!s.halt) toast(`🚦 ${s.tk} trading resumed`); }
  stepPrices(S.dayLength, dt, false);
  hourly();
  processSchedule();
  for (const p of S.pending) p.at -= dt;
  for (const p of S.pending.filter(p => p.at <= 0)) fireCompanyNews(p.s, p.good, p.mag);
  S.pending = S.pending.filter(p => p.at > 0);
  S.nextEvent -= dt;
  if (S.nextEvent <= 0) { spawnEvent(); scheduleNextEvent(); }
  if (S.boss && S.boss.id === 'whale') { S.whaleIn -= dt; if (S.whaleIn <= 0) { whaleMove(); S.whaleIn = rand(7, 11); } }
  autoClose();
  const nw = netWorth();
  S.peak = Math.max(S.peak, nw);
  if (nw <= 0) return gameOver('Margin call! Your net worth hit zero.');
  S.timeLeft -= dt;
  if (S.timeLeft <= 0) return endDay();
  renderLive();
}

// ================= Trading =================
function buyingPower() { return S.cash + (has('margin') ? .5 * Math.max(0, netWorth()) : 0); }
function shortRoom() {
  if (!has('short')) return 0;
  const exposure = S.stocks.reduce((a, s) => a + Math.max(0, -s.qty) * s.price, 0);
  return Math.max(0, netWorth() * (has('margin') ? 1.5 : 1) - exposure);
}
const fee = (cost) => has('nofee') ? 0 : Math.max(1, cost * FEE_RATE);

function maxBuy(s) {
  const bp = buyingPower();
  let n = Math.floor(bp / (s.price * (has('nofee') ? 1 : 1 + FEE_RATE)));
  if (!has('nofee')) while (n > 0 && n * s.price + fee(n * s.price) > bp) n--;
  return Math.max(0, n);
}
function maxSell(s) { return Math.max(0, s.qty) + Math.floor(shortRoom() / s.price); }
function qtyFor(s, side) {
  const max = side === 'buy' ? maxBuy(s) : maxSell(s);
  if (qtyMode === 'max') return max;
  if (qtyMode === 'half') return max > 1 ? Math.floor(max / 2) : max;
  return Math.min(max, +qtyMode);
}

// delta > 0 buys, delta < 0 sells. Returns realised profit on the closed part.
function trade(s, delta, auto) {
  if (!delta) return 0;
  const cost = delta * s.price;
  const f = fee(Math.abs(cost));
  const before = s.qty;
  let pnl = 0;
  if (before !== 0 && Math.sign(delta) !== Math.sign(before)) {
    const closed = Math.min(Math.abs(delta), Math.abs(before));
    pnl = (s.price - s.avg) * closed * Math.sign(before);
    S.bestTrade = Math.max(S.bestTrade, pnl);
  }
  S.cash -= cost + f;
  if (delta < 0 && has('cashback')) S.cash += Math.abs(cost) * .01 * S.perks.cashback;
  S.fees += f;
  s.qty += delta;
  if (s.qty === 0) s.avg = 0;
  else if (Math.sign(s.qty) !== Math.sign(before)) s.avg = s.price;
  else if (Math.abs(s.qty) > Math.abs(before)) s.avg = (s.avg * Math.abs(before) + s.price * Math.abs(delta)) / Math.abs(s.qty);
  S.trades++;
  s.marks.push({ t: S.tick, side: delta > 0 ? 'B' : 'S' });
  if (s.marks.length > 40) s.marks.shift();
  if (!auto) renderLive();
  return pnl;
}

function doTrade(side) {
  if (!S || S.phase !== 'trading' || S.paused) return;
  const s = S.stocks[S.selected];
  if (s.halt > 0) { toast(`🚦 ${s.tk} is halted`, 'bad'); return; }
  const n = qtyFor(s, side);
  if (n <= 0) { toast(side === 'buy' ? 'Not enough cash' : (has('short') ? 'No room to short more' : `You don't own any ${s.tk}`), 'bad'); return; }
  const closing = (side === 'sell' && s.qty > 0) || (side === 'buy' && s.qty < 0);
  const pnl = trade(s, side === 'buy' ? n : -n);
  buzz(12);
  if (closing) { sfx.sell(pnl); floatText($(side === 'buy' ? 'buyBtn' : 'sellBtn'), pnl); }
  else sfx.buy();
}

function closeAll() {
  if (!S || S.phase !== 'trading') return;
  let total = 0, n = 0;
  for (const s of S.stocks) if (s.qty && s.halt <= 0) { total += trade(s, -s.qty, true); n++; }
  if (!n) return;
  sfx.sell(total); buzz(20);
  toast(`Closed ${n} position${n > 1 ? 's' : ''}: ${total >= 0 ? '+' : ''}${money(total)}`, total >= 0 ? 'good' : 'bad');
  render();
}

function floatText(anchor, pnl) {
  if (!anchor) return;
  const r = anchor.getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'float';
  el.style.left = (r.left + r.width / 2 - 40) + 'px';
  el.style.top = (r.top - 10) + 'px';
  el.style.color = pnl >= 0 ? 'var(--up)' : 'var(--down)';
  el.textContent = (pnl >= 0 ? '+' : '') + money(pnl);
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1100);
}

function flashRow(s, up) {
  const i = S.stocks.indexOf(s);
  const row = document.querySelector(`#stocks .row[data-i="${i}"]`);
  if (!row) return;
  row.classList.remove('flash-up', 'flash-down');
  void row.offsetWidth;
  row.classList.add(up ? 'flash-up' : 'flash-down');
}

function shake() {
  const app = $('app');
  if (!app.animate || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  app.animate([{ transform: 'translate(0,0)' }, { transform: 'translate(-8px,3px)' }, { transform: 'translate(7px,-4px)' }, { transform: 'translate(-4px,2px)' }, { transform: 'translate(0,0)' }], { duration: 450 });
  buzz([30, 40, 30]);
}

// ================= Day flow =================
function endDay() {
  S.phase = 'dayend';
  const nw = netWorth();
  if (nw >= S.target) {
    if (S.boss) { S.bossesBeaten++; meta.bosses++; saveMeta(); }
    sfx.clear(); fx.burst(S.boss ? 200 : 120); buzz([20, 40, 20]);
    showPerkChoice();
  } else if (S.lives > 0) {
    S.lives--;
    S.perks.life = Math.max(0, (S.perks.life || 0) - 1);
    sfx.fail();
    showModal(`
      <div class="card pink">
        <div class="eyebrow">Day ${S.day} missed</div>
        <h2 style="font-size:1.8rem;margin:8px 0">❤️ Second Wind saved you</h2>
        <p style="margin:0">You ended at <b class="num">${money(nw)}</b> but needed <b class="num">${money(S.target)}</b>. One life used.</p>
      </div>
      <button class="big-btn" id="mNext">Keep going →</button>`);
    $('mNext').onclick = () => { closeModal(); startDay(); };
  } else {
    sfx.fail();
    gameOver(`You needed ${money(S.target)} but ended day ${S.day} with ${money(nw)}.`);
  }
}

function rollPerks() {
  const count = 3 + meta.desk.slot;
  const avail = PERKS.filter(p => !(p.once && has(p.id)));
  const out = [];
  while (out.length < count && avail.length) {
    const total = avail.reduce((a, p) => a + RARITY_WEIGHT[p.rarity], 0);
    let r = Math.random() * total;
    const i = avail.findIndex(p => (r -= RARITY_WEIGHT[p.rarity]) < 0);
    out.push(avail.splice(i, 1)[0]);
  }
  // Beating a boss guarantees a legendary
  if (S.boss && !out.some(p => p.rarity === 'legendary')) {
    const leg = avail.filter(p => p.rarity === 'legendary');
    if (leg.length) out[out.length - 1] = pick(leg);
  }
  return out;
}

function gameOver(reason) {
  S.phase = 'over';
  const cleared = S.day - 1;
  const runs = store.get('cc:runs', 0) + 1;
  store.set('cc:runs', runs);
  const board = store.get('cc:board', []);
  const entry = { days: cleared, peak: Math.round(S.peak), date: new Date().toLocaleDateString(), bosses: S.bossesBeaten };
  board.push(entry);
  board.sort((a, b) => b.days - a.days || b.peak - a.peak);
  store.set('cc:board', board.slice(0, 10));
  const place = board.indexOf(entry) + 1;
  const wax = cleared * 3 + S.bossesBeaten * 8 + (cleared >= 10 ? 10 : 0);
  meta.wax += wax; meta.totalWax += wax; saveMeta();
  showModal(`
    <div class="card pink">
      <div class="eyebrow">Run over</div>
      <h2 style="font-size:2rem;margin:8px 0">You survived ${cleared} day${cleared === 1 ? '' : 's'}</h2>

    <button class="big-btn light" id="mHome">Trading Desk</button>`);

// Values that change every tick
function renderLive() {
  if (!S) return;
  const nw = netWorth();
  const set = (id, v) => { const el = $(id); if (el) el.textContent = v; };
  const elapsed = S.dayLength - S.timeLeft;
  set('hClock', clock(S.clockMin));
  set('hLeft', `${Math.max(0, Math.ceil(S.timeLeft))}s left`);
  if ($('dayBar')) $('dayBar').style.width = (elapsed / S.dayLength * 100) + '%';
  set('nw', money(nw));
  set('tCash', money(S.cash));
  set('tHold', money(S.stocks.reduce((a, s) => a + s.qty * s.price, 0)));
  if (S.phase === 'trading' && S._dayStartNW == null) S._dayStartNW = nw;
  set('tDay', pct(nw / (S._dayStartNW ?? nw) - 1));
  const g = nw / S.target;
  set('goalPct', Math.floor(g * 100) + '%');
  if ($('goalBar')) { $('goalBar').firstElementChild.style.width = Math.min(100, g * 100) + '%'; $('goalBar').classList.toggle('done', g >= 1); }
  if ($('frozenBanner')) { $('frozenBanner').classList.toggle('hidden', !(S.frozen > 0)); set('frozenLeft', Math.ceil(S.frozen)); }

  const s = S.stocks[S.selected];
  if ($('cName')) {
    const ch = s.price / s.dayOpen - 1;
    set('cName', `${s.icon} ${s.tk} · ${s.name}`);
    set('cPrice', money(s.price));
    $('cChg').textContent = `${pct(ch)} today`;
    $('cChg').className = 'chg ' + (ch >= 0 ? 'up' : 'down');
    $('trIc').textContent = s.icon;
    $('trIc').style.background = s.color.bg;
    set('trName', `${s.tk} · ${money(s.price)}`);
    set('trPos', s.qty === 0 ? `You own 0 · buying power ${money(buyingPower())}`
      : `${s.qty > 0 ? 'Own' : 'Short'} ${Math.abs(s.qty)} · avg ${money(s.avg)} · P/L ${money((s.price - s.avg) * s.qty)}`);
    const nb = qtyFor(s, 'buy'), ns = qtyFor(s, 'sell');
    set('buyInfo', nb ? `${nb} for ${money(nb * s.price)}` : 'not enough cash');
    set('sellInfo', ns ? `${ns} for ${money(ns * s.price)}` : (has('short') ? 'no short room' : 'none owned'));
    const canTrade = S.phase === 'trading' && !S.paused && s.halt <= 0;
    $('buyBtn').disabled = !canTrade || !nb;
    $('sellBtn').disabled = !canTrade || !ns;
    $('haltNote').classList.toggle('hidden', !(s.halt > 0));
    if (s.halt > 0) $('haltNote').textContent = `🚦 ${s.tk} is halted for ${Math.ceil(s.halt)}s`;
    if ($('freezeBtn')) { $('freezeBtn').disabled = S.freezeUsed || S.phase !== 'trading' || S.paused; $('freezeBtn').textContent = S.freezeUsed ? '🧊 Freeze used today' : '🧊 Freeze the market (8s)'; }

    document.querySelectorAll('#stocks .row').forEach((row, i) => {
      const st = S.stocks[i];
      const c = st.price / st.dayOpen - 1;
      row.classList.toggle('sel', i === S.selected);
      row.querySelector('.halt-b').classList.toggle('hidden', !(st.halt > 0));
      row.querySelector('.sub').textContent = `${money(st.price)}${st.qty ? ` · ${st.qty > 0 ? 'own' : 'short'} ${Math.abs(st.qty)}` : ` · ${st.name}`}`;
      row.querySelector('.pct').innerHTML = `<span style="color:${c >= 0 ? 'var(--up)' : 'var(--down)'}">${pct(c)}<small>today</small></span>`;
      const pts = st.hist.slice(-60);
      const lo = Math.min(...pts), hi = Math.max(...pts), span = hi - lo || 1;
      row.querySelector('polyline').setAttribute('points', pts.map((p, j) => `${(j / (pts.length - 1) * 60).toFixed(1)},${(26 - (p - lo) / span * 24).toFixed(1)}`).join(' '));
    });
    drawChart();
  }
  if ($('freezeBtn2')) $('freezeBtn2').disabled = S.freezeUsed || S.phase !== 'trading';
}

// ================= Chart =================
function drawChart() {
  const cv = $('chart');
  if (!cv || !S) return;
  const s = S.stocks[S.selected];
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const N = 240;
  const pts = s.hist.slice(-N);
  if (pts.length < 2) return;
  const first = S.tick - pts.length + 1;          // absolute tick of pts[0]
  const top = 34, bottom = H - 8, right = W - 4;

  // Group ticks into 30 in-game-minute candles, aligned to absolute tick numbers
  const K = Math.max(3, Math.round(30 / minutesPerTick()));
  const candles = [];
  for (let i = 0; i < pts.length; i++) {
    const g = Math.floor((first + i) / K);
    let c = candles[candles.length - 1];
    if (!c || c.g !== g) { c = { g, o: i > 0 ? pts[i - 1] : pts[i], h: -Infinity, l: Infinity, c: 0, i0: i }; candles.push(c); }
    c.h = Math.max(c.h, pts[i], c.o); c.l = Math.min(c.l, pts[i], c.o); c.c = pts[i]; c.i1 = i;
  }
  let lo = Math.min(...pts), hi = Math.max(...pts);
  if (s.qty && s.avg) { lo = Math.min(lo, s.avg); hi = Math.max(hi, s.avg); }
  const pad = (hi - lo) * .12 || hi * .01;
  const y = (p) => bottom - (p - (lo - pad)) / ((hi + pad) - (lo - pad)) * (bottom - top);
  const slots = Math.ceil(N / K) + 1;
  const slotW = right / slots;
  const xOfTick = (i) => {      // x position for pts index i
    const ci = candles.findIndex(c => i >= c.i0 && i <= c.i1);
    return (slots - candles.length + ci + .5) * slotW;
  };
  const xLine = (i) => (N - pts.length + i) / (N - 1) * right;

  // Dashed grid
  ctx.strokeStyle = 'rgba(31,27,36,.08)'; ctx.setLineDash([4, 6]); ctx.lineWidth = 1;
  for (let k = 0; k < 3; k++) { const gy = top + k * (bottom - top) / 2; ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke(); }
  ctx.setLineDash([]);

  if (chartMode === 'candles') {
    const bw = Math.max(3, slotW * .62);
    candles.forEach((c, ci) => {
      const cx = (slots - candles.length + ci + .5) * slotW;
      const up = c.c >= c.o;
      const col = up ? '#23966a' : '#e0516c';
      ctx.strokeStyle = col; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(cx, y(c.h)); ctx.lineTo(cx, y(c.l)); ctx.stroke();
      const yt = y(Math.max(c.o, c.c)), yb = y(Math.min(c.o, c.c));
      ctx.fillStyle = up ? '#23966a' : '#e0516c';
      roundRect(ctx, cx - bw / 2, yt, bw, Math.max(2, yb - yt), Math.min(3, bw / 3));
      ctx.fill();
    });
  } else {
    const path = new Path2D();
    path.moveTo(xLine(0), y(pts[0]));
    for (let i = 1; i < pts.length; i++) {
      const xm = (xLine(i - 1) + xLine(i)) / 2, ym = (y(pts[i - 1]) + y(pts[i])) / 2;
      path.quadraticCurveTo(xLine(i - 1), y(pts[i - 1]), xm, ym);
    }
    path.lineTo(xLine(pts.length - 1), y(pts[pts.length - 1]));
    const area = new Path2D(path);
    area.lineTo(xLine(pts.length - 1), H); area.lineTo(xLine(0), H); area.closePath();
    const grad = ctx.createLinearGradient(0, top, 0, H);
    grad.addColorStop(0, s.color.line + '55'); grad.addColorStop(1, s.color.line + '00');
    ctx.fillStyle = grad; ctx.fill(area);
    ctx.strokeStyle = s.color.line; ctx.lineWidth = 3; ctx.lineJoin = 'round'; ctx.stroke(path);
  }
  const xAt = chartMode === 'candles' ? xOfTick : xLine;

  // Average entry price
  if (s.qty && s.avg) {
    const ay = y(s.avg);
    ctx.strokeStyle = 'rgba(31,27,36,.55)'; ctx.setLineDash([5, 5]); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(0, ay); ctx.lineTo(W, ay); ctx.stroke(); ctx.setLineDash([]);
    ctx.font = '700 11px Outfit, system-ui, sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
    ctx.fillStyle = 'rgba(31,27,36,.7)'; ctx.fillText(`${s.qty > 0 ? 'avg buy' : 'avg short'} ${money(s.avg)}`, 6, ay - 3);
  }

  // Buy/sell markers
  ctx.font = '700 11px Outfit, system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const m of s.marks) {
    const i = m.t - first;
    if (i < 0 || i >= pts.length) continue;
    const mx = xAt(i), my = y(pts[i]) + (m.side === 'B' ? 14 : -14);
    ctx.fillStyle = m.side === 'B' ? '#1f1b24' : '#f07f98';
    ctx.beginPath(); ctx.arc(mx, my, 8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillText(m.side, mx, my + .5);
  }

  // Current price bubble
  const lx = xAt(pts.length - 1), ly = y(pts[pts.length - 1]);
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#1f1b24'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(lx, ly, 5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  const label = money(s.price);
  ctx.font = '700 13px Outfit, system-ui, sans-serif';
  const tw = ctx.measureText(label).width + 20;
  const bx = Math.min(W - tw / 2 - 2, Math.max(tw / 2 + 2, lx));
  const by = Math.max(14, ly - 24);
  ctx.fillStyle = '#1f1b24'; roundRect(ctx, bx - tw / 2, by - 13, tw, 26, 13); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.fillText(label, bx, by + .5);

  const hrs = pts.length * minutesPerTick() / 60;
  const el = $('cxLeft'); if (el) el.textContent = `${Math.round(hrs)}h ago${chartMode === 'candles' ? ' · 30m candles' : ''}`;
}
function roundRect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

// ================= Controls =================
function togglePause() {
  if (!S || S.phase !== 'trading') return;
  S.paused = !S.paused;
  $('pauseBtn').innerHTML = S.paused ? ICON_PLAY : ICON_PAUSE;
  $('pauseBtn').setAttribute('aria-label', S.paused ? 'Resume' : 'Pause');
  if (S.paused) {
    showModal(`<div class="card cream" style="text-align:center"><div class="big">⏸</div><h2 style="margin-top:10px">Paused</h2><p style="color:var(--ink-2);margin:6px 0 0">The market waits for you. Just this once.</p></div><button class="big-btn" id="mResume">Resume</button>`);
    $('mResume').onclick = togglePause;
  } else closeModal();
  renderLive();
}

function toggleMute() {
  muted = !muted;
  store.set('cc:muted', muted);
  const b = $('muteBtn');
  if (b) { b.innerHTML = muted ? ICON_MUTE : ICON_SOUND; b.setAttribute('aria-label', muted ? 'Unmute' : 'Mute'); }
  if (!muted) sfx.tick();
}

function useFreeze() {
  if (!S || !has('freeze') || S.freezeUsed || S.phase !== 'trading') return;
  S.freezeUsed = true;
  S.frozen = 8;
  toast('🧊 Market frozen for 8 seconds', 'good');
  renderLive();
}

document.querySelectorAll('#nav button').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); window.scrollTo({ top: 0 }); });

document.addEventListener('keydown', e => {
  if (!S || e.target.tagName === 'INPUT') return;
  if (e.key === ' ') { e.preventDefault(); togglePause(); }
  if (tab !== 'market' || $('modalRoot').innerHTML) return;
  if (e.key === 'b' || e.key === 'B') doTrade('buy');
  if (e.key === 's' || e.key === 'S') doTrade('sell');
  if (e.key === 'c' || e.key === 'C') setChartMode(chartMode === 'candles' ? 'line' : 'candles');
  if (/^[1-5]$/.test(e.key) && S.stocks[+e.key - 1]) { S.selected = +e.key - 1; renderLive(); }
});

document.addEventListener('visibilitychange', () => {
  if (document.hidden && S && S.phase === 'trading' && !S.paused) togglePause();
});
window.addEventListener('resize', () => drawChart());

let lastTime = performance.now();
setInterval(() => {
  const now = performance.now();
  const dt = Math.min(.5, (now - lastTime) / 1000);
  lastTime = now;
  update(dt);
}, TICK_MS);

// Test hooks
window.__cc = { get S() { return S; }, get meta() { return meta; }, netWorth, goalFor, endDay: () => endDay(), setTimeLeft: (v) => { S.timeLeft = v; }, setDay: (d) => { S.day = d - 1; } };

render();
})();
</script>
